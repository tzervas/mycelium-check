[package]
name = "mycelium-check"
version.workspace = true
description = "myc-check — the project-aware correctness/type-check driver (M-365; the prototype grows up). Resolves a mycelium-proj.toml project, checks the whole phylum/program, aggregates every refusal as an RFC-0013 diagnostic routed via the M-362 baseline, and exits non-zero on any error (CI-usable). Honest per-op tags preserved (VR-5); a refusal is explicit, never silent (G2). KC-3 — above the kernel; the trusted M-210 checker is unchanged."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The trusted checker (M-210), the M-362 baseline routing, and the manifest layer. No new dependency.
mycelium-l1 = { git = "https://github.com/tzervas/mycelium-l1", rev = "4e4a29679d8e941eab86fad40f49c9947e68eefd" }
mycelium-lsp = { git = "https://github.com/tzervas/mycelium-lsp", rev = "ba86f11ef1b33bdd091e897f6549fb87058445fc" }
mycelium-proj = { git = "https://github.com/tzervas/mycelium-proj", rev = "610624021a0ea43d3919d4200d7522e31a6dcce0" }
# M-643: the shared CLI substrate (stdin-or-file `read_source`). In-workspace path dep, std-only —
# no new external crate enters the tree (KC-3).
mycelium-cli-common = { git = "https://github.com/tzervas/mycelium-cli-common", rev = "28e81b67a5d21bc3bdf8904a6ce36dd9ccb515b9" }

[[bin]]
name = "myc-check"
path = "src/bin/myc-check.rs"

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-check"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
